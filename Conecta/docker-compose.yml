services:
  # --- Banco de Dados PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: monorepo-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente local}
      POSTGRES_DB: ${POSTGRES_DB:-monorepo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-monorepo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - monorepo-network

  # --- Cache Redis ---
  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - monorepo-network

  # --- Backend .NET API ---
  backend:
    build:
      context: ./apps/ConectaConstrucoes/backend
      dockerfile: Dockerfile
    container_name: conecta-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      Jwt__Issuer: ${JWT_ISSUER:?Configure JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:?Configure JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Configure JWT_SIGNING_KEY}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-monorepo_db};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente local};
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monorepo-network

  # --- Frontend React Web ---
  frontend:
    build:
      context: ./apps/ConectaConstrucoes/frontend
      dockerfile: Dockerfile
    container_name: conecta-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - monorepo-network

volumes:
  postgres_data:
  redis_data:

networks:
  monorepo-network:
    driver: bridge
